<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aule Libere — UniTo</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #F7F6F2;
    --surface:  #FFFFFF;
    --border:   #E4E2DA;
    --text:     #1A1A18;
    --muted:    #6B6B65;
    --hint:     #A8A89F;
    --green:    #2D7A4F;
    --green-bg: #EBF5EF;
    --green-bd: #B6DFC6;
    --red:      #C0392B;
    --red-bg:   #FDECEA;
    --red-bd:   #F5C3BE;
    --radius:   12px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ── HEADER ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    height: 60px;
    gap: 12px;
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .back-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 500; color: var(--muted);
    text-decoration: none; padding: 5px 12px;
    border: 1px solid var(--border); border-radius: 20px;
    background: var(--bg); transition: color .15s, border-color .15s;
  }
  .back-btn:hover { color: var(--text); border-color: #999; }
  .back-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.5; }
  .logo { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
  .logo span { color: var(--muted); font-weight: 400; }
  #clock {
    font-family: 'DM Mono', monospace;
    font-size: 14px; color: var(--muted);
    background: var(--bg); padding: 4px 10px;
    border-radius: 20px; border: 1px solid var(--border);
    flex-shrink: 0;
  }

  /* ── LAYOUT ── */
  main { max-width: 860px; margin: 0 auto; padding: 2rem 1.5rem; }

  /* ── STATS ── */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 2rem; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.25rem; }
  .stat-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; }
  .stat-val   { font-size: 28px; font-weight: 600; letter-spacing: -0.03em; }
  .stat-val.green { color: var(--green); }
  .stat-val.red   { color: var(--red); }

  /* ── CONTROLS ── */
  .controls { display: flex; gap: 10px; margin-bottom: 1.25rem; align-items: center; flex-wrap: wrap; }
  .search-wrap { position: relative; flex: 1; min-width: 200px; }
  .search-wrap svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--hint); pointer-events: none; }
  #search {
    width: 100%; height: 40px;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--surface); color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 14px;
    padding: 0 12px 0 36px; outline: none; transition: border-color 0.15s;
  }
  #search:focus { border-color: #999; }
  #search::placeholder { color: var(--hint); }

  .tabs { display: flex; gap: 0; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; background: var(--surface); }
  .tab {
    padding: 0 16px; height: 40px;
    background: transparent; border: none; cursor: pointer;
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
    color: var(--muted); transition: background 0.12s, color 0.12s; white-space: nowrap;
  }
  .tab + .tab { border-left: 1px solid var(--border); }
  .tab.active { background: var(--text); color: #fff; }
  .tab:not(.active):hover { background: var(--bg); color: var(--text); }

  /* ── DATA INFO ── */
  .data-row { font-size: 13px; color: var(--muted); margin-bottom: 1.25rem; display: flex; align-items: center; gap: 8px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); display: inline-block; }

  /* ── AULA CARDS ── */
  .aula-list { display: flex; flex-direction: column; gap: 10px; }
  .aula-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1rem 1.25rem;
    transition: border-color 0.15s, box-shadow 0.15s; cursor: default;
  }
  .aula-card:hover { border-color: #ccc; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
  .aula-card.free { border-left: 3px solid var(--green); }
  .aula-card.busy { border-left: 3px solid var(--red); }

  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .aula-name { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .badge { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; letter-spacing: 0.02em; text-transform: uppercase; }
  .badge.free { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-bd); }
  .badge.busy { background: var(--red-bg);   color: var(--red);   border: 1px solid var(--red-bd); }

  .card-sub { font-size: 13px; color: var(--muted); margin-top: 5px; }

  /* Timeline */
  .timeline { margin-top: 12px; }
  .tl-track { height: 6px; background: var(--bg); border-radius: 3px; border: 1px solid var(--border); position: relative; overflow: hidden; }
  .tl-segment { position: absolute; top: 0; height: 100%; border-radius: 2px; }
  .tl-segment.busy-seg { background: #F5C3BE; }
  .tl-now { position: absolute; top: -3px; width: 2px; height: 12px; background: var(--text); border-radius: 1px; }
  .slot-pills { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .pill { font-family: 'DM Mono', monospace; font-size: 11px; padding: 2px 8px; border-radius: 20px; border: 1px solid var(--border); color: var(--muted); background: var(--bg); }
  .pill.cur { background: var(--red-bg); color: var(--red); border-color: var(--red-bd); font-weight: 500; }

  /* ── EMPTY / ERROR / LOADER ── */
  .empty  { text-align: center; padding: 4rem 1rem; color: var(--muted); font-size: 15px; }
  .error  { background: var(--red-bg); border: 1px solid var(--red-bd); border-radius: var(--radius); padding: 1.25rem 1.5rem; font-size: 14px; color: var(--red); line-height: 1.6; }
  .loader { text-align: center; padding: 4rem 1rem; color: var(--hint); }
  .spinner { width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--text); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 1rem; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 560px) {
    header { padding: 0 1rem; }
    main   { padding: 1.25rem 1rem; }
    .stats { grid-template-columns: 1fr 1fr; }
    .stat:last-child { grid-column: 1 / -1; }
    .back-btn span { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <a class="back-btn" href="/">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      <span>Dashboard</span>
    </a>
    <div class="logo">Aule libere <span>/ UniTo</span></div>
  </div>
  <div id="clock">--:--</div>
</header>

<main>
  <div class="stats">
    <div class="stat"><div class="stat-label">Libere ora</div><div class="stat-val green" id="cnt-free">—</div></div>
    <div class="stat"><div class="stat-label">Occupate ora</div><div class="stat-val red" id="cnt-busy">—</div></div>
    <div class="stat"><div class="stat-label">Totale aule oggi</div><div class="stat-val" id="cnt-total">—</div></div>
  </div>

  <div class="controls">
    <div class="search-wrap">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
      </svg>
      <input type="text" id="search" placeholder="Cerca per nome aula..." oninput="render()" />
    </div>
    <div class="tabs">
      <button class="tab active" onclick="setTab('free',this)">Libere ora</button>
      <button class="tab" onclick="setTab('busy',this)">Occupate</button>
      <button class="tab" onclick="setTab('all',this)">Tutte</button>
    </div>
  </div>

  <div class="data-row" id="data-row">
    <span class="dot"></span> <span id="data-label">Caricamento...</span>
  </div>

  <div id="list-area">
    <div class="loader">
      <div class="spinner"></div>
      Recupero dati dal calendario...
    </div>
  </div>
</main>

<script>
const API = "/api/aule";
let state = null;
let currentTab = "free";
const DAY_START = 8, DAY_END = 20;

function updateClock() {
  const now = new Date();
  document.getElementById("clock").textContent =
    now.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
}
updateClock();
setInterval(updateClock, 10000);

function setTab(t, el) {
  currentTab = t;
  document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
  el.classList.add("active");
  render();
}

function timeToMin(str) { const [h,m] = str.split(":").map(Number); return h*60+m; }
function pct(t) { return Math.max(0, Math.min(100, (timeToMin(t) - DAY_START*60) / ((DAY_END-DAY_START)*60) * 100)).toFixed(2); }
function nowMin() { const n = new Date(); return n.getHours()*60+n.getMinutes(); }
function nowPct() { return Math.max(0, Math.min(100, (nowMin()-DAY_START*60) / ((DAY_END-DAY_START)*60) * 100)).toFixed(2); }

async function load() {
  try {
    const res = await fetch(API);
    if (!res.ok) throw new Error("HTTP " + res.status);
    state = await res.json();
    if (state.error) throw new Error(state.error);
    document.getElementById("data-label").textContent = state.data + " — aggiornato alle " + state.ora;
    updateStats();
    render();
  } catch(e) {
    document.getElementById("data-label").textContent = "Errore di caricamento";
    document.getElementById("list-area").innerHTML =
      `<div class="error"><strong>Impossibile caricare il calendario.</strong><br>Dettaglio: ${e.message}</div>`;
  }
}

function updateStats() {
  if (!state) return;
  const nomi = Object.keys(state.aule);
  document.getElementById("cnt-free").textContent  = nomi.filter(n => !state.aule[n].occupata_ora).length;
  document.getElementById("cnt-busy").textContent  = nomi.filter(n =>  state.aule[n].occupata_ora).length;
  document.getElementById("cnt-total").textContent = nomi.length;
}

function render() {
  if (!state) return;
  const q = document.getElementById("search").value.toLowerCase();
  let nomi = Object.keys(state.aule).sort((a,b) => state.aule[a].nome.localeCompare(state.aule[b].nome));
  if (q) nomi = nomi.filter(n => state.aule[n].nome.toLowerCase().includes(q));
  if (currentTab === "free") nomi = nomi.filter(n => !state.aule[n].occupata_ora);
  if (currentTab === "busy") nomi = nomi.filter(n =>  state.aule[n].occupata_ora);

  if (!nomi.length) {
    document.getElementById("list-area").innerHTML = '<div class="empty">Nessuna aula trovata</div>';
    return;
  }

  const np = nowPct();
  const cards = nomi.map(nome => {
    const a    = state.aule[nome];
    const free = !a.occupata_ora;
    let sub = "";
    if (!free && a.prossima_libera)  sub = `Libera dalle <strong>${a.prossima_libera}</strong>`;
    else if (free && a.prossimo_impegno) sub = `Libera fino alle <strong>${a.prossimo_impegno}</strong>`;
    else if (free) sub = "Libera per il resto della giornata";

    const segments = a.impegni.map(ev => {
      const left  = pct(ev.inizio);
      const width = (pct(ev.fine) - left).toFixed(2);
      return `<div class="tl-segment busy-seg" style="left:${left}%;width:${width}%"></div>`;
    }).join("");

    const pills = a.impegni.map(ev =>
      `<span class="pill${!ev.libera_ora ? " cur" : ""}">${ev.inizio}–${ev.fine}</span>`
    ).join("");

    return `
      <div class="aula-card ${free ? "free" : "busy"}">
        <div class="card-top">
          <span class="aula-name">${a.nome}</span>
          <span class="badge ${free ? "free" : "busy"}">${free ? "Libera" : "Occupata"}</span>
        </div>
        ${sub ? `<div class="card-sub">${sub}</div>` : ""}
        ${a.impegni.length ? `
        <div class="timeline">
          <div class="tl-track">
            ${segments}
            <div class="tl-now" style="left:${np}%"></div>
          </div>
          <div class="slot-pills">${pills}</div>
        </div>` : ""}
      </div>`;
  }).join("");

  document.getElementById("list-area").innerHTML = `<div class="aula-list">${cards}</div>`;
}

load();
setInterval(load, 60000);
</script>
</body>
</html>
